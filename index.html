<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bazar da Anna">
<meta name="theme-color" content="#FFF7FB">
<title>Bazar da Anna</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23D6407F'/%3E%3Ctext x='90' y='124' font-family='Georgia,serif' font-size='104' font-weight='700' fill='%23FFF7FB' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23D6407F'/%3E%3Ctext x='90' y='124' font-family='Georgia,serif' font-size='104' font-weight='700' fill='%23FFF7FB' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --rosa: #D6407F;
    --rosa-esc: #C63274;
    --rosa-claro: #FCE1EE;
    --rosa-pale: #FCE7F0;
    --fundo: #FFF7FB;
    --borda: #F3DEE8;
    --borda-input: #EFD9E4;
    --texto: #3A2530;
    --suave: #A98A97;
    --verde: #2FA36B;
    --nav-h: calc(76px + env(safe-area-inset-bottom));
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: var(--fundo);
    font-family: 'Poppins', -apple-system, sans-serif;
    color: var(--texto);
    overscroll-behavior-y: none;
  }
  body { display: flex; flex-direction: column; }
  input, select, button, textarea { font-family: inherit; font-size: 16px; }
  button { cursor: pointer; }
  .scr::-webkit-scrollbar { width: 0; height: 0; }

  #app {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: calc(env(safe-area-inset-top) + 14px) 20px calc(var(--nav-h) + 24px);
  }
  h1.titulo { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 700; margin: 0; }
  .sub { font-size: 13px; color: var(--suave); margin-top: 1px; }
  .secao { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 600; margin: 22px 2px 12px; }

  .card { background: #fff; border: 1px solid var(--borda); border-radius: 20px; }
  .destaque {
    border-radius: 26px; padding: 22px 24px; color: #fff;
    background: linear-gradient(135deg, #E0508F 0%, var(--rosa-esc) 100%);
    box-shadow: 0 14px 30px rgba(198, 50, 116, 0.28);
  }
  .pill {
    border: none; background: var(--rosa); color: #fff; font-size: 13.5px; font-weight: 600;
    padding: 10px 16px; border-radius: 999px; box-shadow: 0 6px 16px rgba(214, 64, 127, 0.3);
  }
  .btn-full {
    width: 100%; border: none; background: var(--rosa); color: #fff;
    font-size: 15px; font-weight: 600; padding: 14px; border-radius: 14px;
  }
  .btn-grande {
    width: 100%; border: none; color: #fff; font-size: 15.5px; font-weight: 700;
    padding: 15px; border-radius: 16px;
    background: linear-gradient(135deg, #E0508F, var(--rosa-esc));
    box-shadow: 0 10px 22px rgba(198, 50, 116, 0.3);
  }
  .btn-grande:active, .btn-full:active, .pill:active { filter: brightness(0.94); }
  input.campo, select.campo, textarea.campo {
    width: 100%; border: 1px solid var(--borda-input); background: var(--fundo);
    border-radius: 13px; padding: 13px 14px; color: var(--texto); outline: none; appearance: none;
  }
  input.campo:focus, select.campo:focus { border-color: var(--rosa); }
  label.rot { font-size: 13px; font-weight: 600; display: block; margin-bottom: 8px; }
  .opcoes { display: flex; gap: 9px; }
  .opcoes button {
    flex: 1; border: 1.5px solid var(--borda-input); background: var(--fundo); color: #9A8089;
    font-size: 13.5px; font-weight: 600; padding: 11px 0; border-radius: 13px;
  }
  .opcoes button.sel { border-color: var(--rosa); background: var(--rosa-pale); color: var(--rosa); }

  .linha { display: flex; align-items: center; justify-content: space-between; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .trunc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vazio { text-align: center; color: var(--suave); font-size: 13.5px; padding: 26px 10px; }

  .item {
    background: #fff; border: 1px solid var(--borda); border-radius: 18px;
    padding: 13px 16px; display: flex; align-items: center; gap: 13px; margin-bottom: 10px;
  }
  .thumb {
    width: 42px; height: 42px; border-radius: 12px; flex: none; object-fit: cover;
    background: repeating-linear-gradient(45deg, var(--rosa-claro), var(--rosa-claro) 6px, #FBD3E6 6px, #FBD3E6 12px);
  }

  .prod-foto {
    width: 100%; height: 128px; position: relative; display: block; object-fit: cover;
    background: repeating-linear-gradient(45deg, var(--rosa-claro), var(--rosa-claro) 9px, #FBD3E6 9px, #FBD3E6 18px);
  }
  .tag-estoque {
    position: absolute; top: 8px; right: 8px; font-size: 10.5px; font-weight: 700;
    background: #fff; padding: 3px 8px; border-radius: 999px;
  }
  .chips {
    display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px 16px; padding: 0 20px 2px;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { width: 0; height: 0; }
  .chips button {
    flex: none; border: 1px solid var(--borda-input); background: #fff; color: #9A8089;
    font-size: 12.5px; font-weight: 600; padding: 8px 14px; border-radius: 999px; white-space: nowrap;
  }
  .chips button.sel { border-color: var(--rosa); background: var(--rosa); color: #fff; }

  .tag-estoque.vendido {
    background: var(--texto); color: #fff; letter-spacing: .03em;
    box-shadow: 0 2px 8px rgba(58, 37, 48, .3);
  }

  nav {
    position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-h);
    background: rgba(255, 247, 251, 0.94); backdrop-filter: blur(12px);
    border-top: 1px solid var(--borda); display: flex; align-items: flex-start;
    padding: 10px 14px calc(env(safe-area-inset-bottom)); z-index: 10;
  }
  nav button {
    flex: 1; background: none; border: none; display: flex; flex-direction: column;
    align-items: center; gap: 5px; color: #B79AA6; padding: 0;
  }
  nav button.on { color: var(--rosa); }
  nav span { font-size: 11px; font-weight: 600; }

  #toast {
    position: fixed; bottom: calc(var(--nav-h) + 16px); left: 50%; transform: translateX(-50%);
    background: var(--texto); color: #fff; font-size: 13.5px; font-weight: 500;
    padding: 11px 20px; border-radius: 999px; z-index: 40; max-width: 88vw; text-align: center;
    box-shadow: 0 8px 20px rgba(58, 37, 48, 0.35); animation: toastIn 0.25s ease;
  }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }
  @keyframes sheetIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes subir { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .anim { animation: sheetIn 0.2s ease; }

  #modal {
    position: fixed; inset: 0; z-index: 50; background: rgba(58, 37, 48, 0.42);
    display: flex; align-items: flex-end;
  }
  #modal > div {
    width: 100%; background: var(--fundo); border-radius: 26px 26px 0 0;
    padding: 22px 20px calc(env(safe-area-inset-bottom) + 22px);
    animation: subir 0.22s ease; max-height: 88vh; overflow-y: auto;
  }
  .acao {
    width: 100%; text-align: left; background: #fff; border: 1px solid var(--borda);
    border-radius: 14px; padding: 14px 16px; font-size: 15px; font-weight: 600;
    color: var(--texto); margin-bottom: 9px;
  }
  .acao.perigo { color: var(--rosa); }
</style>
</head>
<body>

<div id="app" class="scr"></div>

<nav id="nav"></nav>

<script>
'use strict';

/* ---------------- dados ---------------- */

const CHAVE = 'bazar_anna_v1';

const SEMENTE = {
  products: [
    { id: 'p1', nome: 'Vestido floral vintage', tamanho: 'M', preco: 45, estoque: 1, foto: null },
    { id: 'p2', nome: 'Blusa de tricô rosa', tamanho: 'P', preco: 30, estoque: 2, foto: null },
    { id: 'p3', nome: 'Calça jeans mom', tamanho: '38', preco: 55, estoque: 1, foto: null },
  ],
  sales: [],
  movements: [],
};

let dados = carregar();
let aba = 'inicio';
let formProduto = false;   // false | true | id da peça em edição
let formCaixa = false;
let busca = '';
let ordem = carregarOrdem();   // preferência dela, fica salva entre as aberturas
let pagamento = 'Pix';
let tipoCaixa = 'entrada';

function carregar() {
  try {
    const bruto = localStorage.getItem(CHAVE);
    if (!bruto) return JSON.parse(JSON.stringify(SEMENTE));
    const d = JSON.parse(bruto);
    return {
      products: Array.isArray(d.products) ? d.products : [],
      sales: Array.isArray(d.sales) ? d.sales : [],
      movements: Array.isArray(d.movements) ? d.movements : [],
    };
  } catch (e) {
    return JSON.parse(JSON.stringify(SEMENTE));
  }
}

function salvar() {
  try {
    localStorage.setItem(CHAVE, JSON.stringify(dados));
  } catch (e) {
    toast('Memória cheia — apague fotos antigas');
  }
}

/* ---------------- utilidades ---------------- */

const $ = (sel) => document.querySelector(sel);
const id = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function brl(n) { return 'R$ ' + Number(n || 0).toFixed(2).replace('.', ','); }

// aceita "45", "45,90", "1.200,50" e "1200.50"
function num(v) {
  let s = String(v == null ? '' : v).replace(/[^0-9.,]/g, '');
  if (!s) return 0;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = parseFloat(s);
  return isNaN(n) || n < 0 ? 0 : n;
}

function diaDe(ts) { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }

function quando(ts) {
  const hora = new Date(ts).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  const dif = Math.round((diaDe(Date.now()) - diaDe(ts)) / 86400000);
  if (dif === 0) return 'Hoje, ' + hora;
  if (dif === 1) return 'Ontem, ' + hora;
  return new Date(ts).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + ', ' + hora;
}

let tempoToast;
function toast(msg) {
  const antigo = $('#toast');
  if (antigo) antigo.remove();
  const el = document.createElement('div');
  el.id = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(tempoToast);
  tempoToast = setTimeout(() => el.remove(), 2200);
}

function valor(sel) { const el = $(sel); return el ? el.value : ''; }

/* ---------------- cálculos ---------------- */

function resumo() {
  const entradas = dados.movements.filter(m => m.tipo === 'entrada').reduce((a, m) => a + m.valor, 0);
  const saidas = dados.movements.filter(m => m.tipo === 'saida').reduce((a, m) => a + m.valor, 0);
  const hoje = diaDe(Date.now());
  const vendasHoje = dados.sales.filter(v => diaDe(v.ts) === hoje);
  const totalHoje = vendasHoje.reduce((a, v) => a + v.valor, 0);
  return {
    entradas, saidas, saldo: entradas - saidas,
    vendasHoje, totalHoje,
    ticket: vendasHoje.length ? totalHoje / vendasHoje.length : 0,
    estoque: dados.products.reduce((a, p) => a + p.estoque, 0),
  };
}

// últimos 7 dias, terminando hoje
function semana() {
  const nomes = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
  const hoje = diaDe(Date.now());
  const dias = [];
  for (let i = 6; i >= 0; i--) {
    const d = hoje - i * 86400000;
    const total = dados.sales.filter(v => diaDe(v.ts) === d).reduce((a, v) => a + v.valor, 0);
    dias.push({ dia: nomes[new Date(d).getDay()], total, hoje: i === 0 });
  }
  const max = Math.max(...dias.map(d => d.total), 1);
  return dias.map(d => ({
    dia: d.dia,
    altura: d.total === 0 ? '3px' : Math.max(6, Math.round(d.total / max * 100)) + '%',
    cor: d.hoje ? 'var(--rosa)' : '#F6C4DC',
  }));
}

const corEstoque = (q) => q === 0 ? '#B79AA6' : q === 1 ? 'var(--rosa)' : 'var(--verde)';
const rotuloEstoque = (q) => q === 0 ? 'Vendido' : q + ' un';

// tira acento e caixa alta, pra buscar "trico" e achar "tricô"
function chave(s) {
  return String(s == null ? '' : s)
    .normalize('NFD')
    .split('')
    .filter((c) => { const n = c.charCodeAt(0); return n < 0x300 || n > 0x36f; })
    .join('')
    .toLowerCase()
    .trim();
}

/* ---------------- pedaços de tela ---------------- */

function linhaVenda(v) {
  return `
    <div class="item" onclick="menuVenda('${v.id}')">
      ${v.foto ? `<img class="thumb" src="${esc(v.foto)}" alt="">` : '<div class="thumb"></div>'}
      <div style="flex:1; min-width:0;">
        <div class="trunc" style="font-size:14px; font-weight:600;">${esc(v.produto)}</div>
        <div style="font-size:12.5px; color:var(--suave);">${esc(v.cliente)} · ${esc(quando(v.ts))}</div>
      </div>
      <div style="text-align:right; flex:none;">
        <div style="font-size:15px; font-weight:700;">${brl(v.valor)}</div>
        <div style="font-size:11px; color:var(--rosa); font-weight:600;">${esc(v.pagamento)}</div>
      </div>
    </div>`;
}

function listaVendas(qtd) {
  const vs = dados.sales.slice(0, qtd);
  if (!vs.length) return '<div class="vazio">Nenhuma venda registrada ainda</div>';
  return vs.map(linhaVenda).join('');
}

/* ---------------- telas ---------------- */

function telaInicio() {
  const r = resumo();
  let data = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
  data = data.charAt(0).toUpperCase() + data.slice(1);

  return `
    <div class="linha" style="align-items:center;">
      <div>
        <div style="font-size:13px; color:var(--suave); font-weight:500;">${esc(data)}</div>
        <h1 class="titulo" style="font-size:27px;">Oi, Anna</h1>
      </div>
      <button onclick="menuAjustes()" style="width:44px; height:44px; border:none; border-radius:50%; background:var(--rosa-claro);
        font-family:'Playfair Display',serif; font-size:19px; font-weight:700; color:var(--rosa);">A</button>
    </div>

    <div class="destaque" style="margin-top:16px;">
      <div style="font-size:13px; opacity:.9; font-weight:500;">Saldo em caixa</div>
      <div style="font-size:38px; font-weight:700; margin-top:4px; letter-spacing:-.02em;">${brl(r.saldo)}</div>
      <div style="font-size:12.5px; opacity:.82; margin-top:2px;">atualizado agora</div>
    </div>

    <div class="grid2" style="margin-top:14px;">
      <div class="card" style="padding:16px 18px;">
        <div style="font-size:12.5px; color:var(--suave); font-weight:500;">Vendas hoje</div>
        <div style="font-size:23px; font-weight:700; margin-top:2px;">${brl(r.totalHoje)}</div>
        <div style="font-size:12px; color:var(--rosa); font-weight:600; margin-top:2px;">
          ${r.vendasHoje.length === 1 ? '1 venda' : r.vendasHoje.length + ' vendas'}</div>
      </div>
      <div class="card" style="padding:16px 18px;">
        <div style="font-size:12.5px; color:var(--suave); font-weight:500;">Em estoque</div>
        <div style="font-size:23px; font-weight:700; margin-top:2px;">${r.estoque}</div>
        <div style="font-size:12px; color:var(--suave); font-weight:500; margin-top:2px;">peças à venda</div>
      </div>
    </div>

    <div class="card" style="padding:18px 20px 14px; margin-top:14px; border-radius:22px;">
      <div class="linha" style="align-items:baseline;">
        <div style="font-size:14.5px; font-weight:600;">Vendas da semana</div>
        <div style="font-size:12.5px; color:var(--suave);">Ticket médio ${brl(r.ticket)}</div>
      </div>
      <div style="display:flex; align-items:flex-end; gap:8px; height:96px; margin-top:14px;">
        ${semana().map(d => `
          <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:7px; height:100%; justify-content:flex-end;">
            <div style="width:100%; max-width:20px; border-radius:7px 7px 4px 4px; background:${d.cor}; height:${d.altura};"></div>
            <div style="font-size:11px; color:var(--suave); font-weight:500;">${d.dia}</div>
          </div>`).join('')}
      </div>
    </div>

    <div class="linha" style="margin:22px 2px 10px;">
      <div class="secao" style="margin:0;">Últimas vendas</div>
      <span onclick="irPara('vender')" style="font-size:13px; color:var(--rosa); font-weight:600;">Registrar</span>
    </div>
    ${listaVendas(4)}`;
}

function telaProdutos() {
  const editando = typeof formProduto === 'string'
    ? dados.products.find(p => p.id === formProduto) : null;

  const form = !formProduto ? '' : `
    <div class="card anim" style="padding:18px; margin-bottom:18px; border-radius:22px;">
      <div style="font-size:14.5px; font-weight:600; margin-bottom:12px;">
        ${editando ? 'Editar peça' : 'Cadastrar peça'}</div>

      <div style="display:flex; gap:12px; margin-bottom:12px; align-items:center;">
        <label style="flex:none; cursor:pointer;">
          <img id="previa" class="thumb" style="width:64px; height:64px; border-radius:16px;" alt=""
               ${editando && editando.foto ? `src="${esc(editando.foto)}"` : ''}>
          <input type="file" accept="image/*" style="display:none" onchange="escolherFoto(event)">
        </label>
        <div style="font-size:12.5px; color:var(--suave); line-height:1.4;">
          Toque no quadrado para<br>tirar ou escolher a foto
        </div>
      </div>

      <input id="pNome" class="campo" placeholder="Nome da peça" style="margin-bottom:10px;"
             value="${editando ? esc(editando.nome) : ''}">
      <div class="grid2" style="gap:10px; margin-bottom:10px;">
        <input id="pTam" class="campo" placeholder="Tamanho (P, M, 38…)" value="${editando ? esc(editando.tamanho) : ''}">
        <input id="pPreco" class="campo" inputmode="decimal" placeholder="Preço R$"
               value="${editando ? String(editando.preco).replace('.', ',') : ''}">
      </div>
      <div class="grid2" style="gap:10px; margin-bottom:14px;">
        <input id="pQtd" class="campo" inputmode="numeric" placeholder="Quantidade"
               value="${editando ? editando.estoque : 1}">
        <button onclick="fecharFormProduto()" style="border:1px solid var(--borda-input); background:var(--fundo);
          color:var(--suave); font-size:14px; font-weight:600; border-radius:13px;">Cancelar</button>
      </div>
      <button class="btn-full" onclick="salvarProduto()">
        ${editando ? 'Salvar alterações' : 'Adicionar ao catálogo'}</button>
    </div>`;

  return `
    <div class="linha" style="align-items:flex-end; margin-bottom:14px;">
      <div>
        <h1 class="titulo">Produtos</h1>
        <div class="sub" id="contaProdutos">${rotuloCatalogo()}</div>
      </div>
      <button class="pill" onclick="abrirFormProduto()">+ Nova peça</button>
    </div>

    <div style="position:relative; margin-bottom:16px;">
      <svg style="position:absolute; left:14px; top:50%; transform:translateY(-50%); pointer-events:none;"
           width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#C0A2B0"
           stroke-width="2.2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path>
      </svg>
      <input id="busca" class="campo" style="padding-left:40px; padding-right:38px;"
             placeholder="Buscar peça…" autocomplete="off" autocorrect="off"
             value="${esc(busca)}" oninput="filtrar(this.value)">
      <button id="limpaBusca" onclick="limparBusca()"
              style="position:absolute; right:6px; top:50%; transform:translateY(-50%); border:none;
                     background:none; color:var(--suave); font-size:20px; line-height:1; padding:8px 10px;
                     display:${busca ? 'block' : 'none'};">&times;</button>
    </div>

    <div class="chips" id="chipsOrdem">
      ${ORDENS.map(o => `
        <button data-ordem="${o.chave}" class="${ordem === o.chave ? 'sel' : ''}"
                onclick="escolherOrdem('${o.chave}')">${o.nome}</button>`).join('')}
    </div>

    ${form}
    <div id="grade">${gradeProdutos()}</div>`;
}

function rotuloCatalogo() {
  const total = dados.products.length;
  const achados = produtosFiltrados().length;
  if (busca) return achados === 1 ? '1 peça encontrada' : achados + ' peças encontradas';
  return total + (total === 1 ? ' peça' : ' peças') + ' no catálogo';
}

const ORDENS = [
  { chave: 'recentes', nome: 'Recentes' },
  { chave: 'az', nome: 'A–Z' },
  { chave: 'barato', nome: 'Mais baratas' },
  { chave: 'caro', nome: 'Mais caras' },
  { chave: 'disponivel', nome: 'Disponíveis' },
  { chave: 'vendida', nome: 'Vendidas' },
];

const CHAVE_ORDEM = 'bazar_anna_ordem';

function carregarOrdem() {
  try {
    const salva = localStorage.getItem(CHAVE_ORDEM);
    return ORDENS.some(o => o.chave === salva) ? salva : 'recentes';
  } catch (e) {
    return 'recentes';
  }
}

// compara pelo nome, sem acento — critério de desempate de todas as ordens
const porNome = (a, b) => chave(a.nome).localeCompare(chave(b.nome), 'pt-BR');

function ordenar(lista) {
  const l = lista.slice();   // não mexe na ordem original do catálogo
  switch (ordem) {
    case 'az':
      return l.sort(porNome);
    case 'barato':
      return l.sort((a, b) => a.preco - b.preco || porNome(a, b));
    case 'caro':
      return l.sort((a, b) => b.preco - a.preco || porNome(a, b));
    case 'disponivel':
      return l.sort((a, b) => (a.estoque === 0) - (b.estoque === 0) || porNome(a, b));
    case 'vendida':
      return l.sort((a, b) => (b.estoque === 0) - (a.estoque === 0) || porNome(a, b));
    default:
      return l;   // ordem de cadastro, mais novas primeiro
  }
}

function produtosFiltrados() {
  const termos = chave(busca).split(/\s+/).filter(Boolean);
  const achados = !termos.length ? dados.products : dados.products.filter(p => {
    const alvo = chave(p.nome + ' ' + p.tamanho);
    return termos.every(t => alvo.includes(t));
  });
  return ordenar(achados);
}

function escolherOrdem(nova) {
  ordem = nova;
  try { localStorage.setItem(CHAVE_ORDEM, nova); } catch (e) { /* modo privado */ }
  document.querySelectorAll('#chipsOrdem button').forEach(b => {
    b.classList.toggle('sel', b.dataset.ordem === nova);

let fotoNova = null; // dataURL enquanto o formulário está aberto

function abrirFormProduto() {
  formProduto = formProduto ? false : true;
  fotoNova = null;
  render(true);
}

function fecharFormProduto() {

}

function editarProduto(pid) {
  fecharModal();
  aba = 'produtos';
  formProduto = pid;
  fotoNova = null;
  render();

// reduz a foto antes de guardar — localStorage é pequeno
function escolherFoto(ev) {
  const arq = ev.target.files && ev.target.files[0];
  if (!arq) return;
  const leitor = new FileReader();
  leitor.onload = () => {
    const img = new Image();
    img.onload = () => {
      const lado = 560;
      const escala = Math.min(1, lado / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * escala);
      cv.height = Math.round(img.height * escala);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      fotoNova = cv.toDataURL('image/jpeg', 0.7);
      const previa = $('#previa');
      if (previa) previa.src = fotoNova;
    };
    img.onerror = () => toast('Não consegui ler essa imagem');
    img.src = leitor.result;
  };
  leitor.readAsDataURL(arq);
}

function salvarProduto() {
  const nome = valor('#pNome').trim();
  const preco = num(valor('#pPreco'));
  const tamanho = valor('#pTam').trim() || 'Único';
  const qtd = Math.max(0, Math.round(num(valor('#pQtd'))));

  if (!nome) return toast('Informe o nome da peça');
  if (preco <= 0) return toast('Informe o preço');

  if (typeof formProduto === 'string') {
    const p = dados.products.find(x => x.id === formProduto);
    if (p) {
      p.nome = nome; p.tamanho = tamanho; p.preco = preco; p.estoque = qtd;
      if (fotoNova) p.foto = fotoNova;
    }
    toast('Peça atualizada');
  } else {
    dados.products.unshift({ id: id('p'), nome, tamanho, preco, estoque: qtd || 1, foto: fotoNova });
    toast('Peça adicionada ao catálogo');
  }

  fotoNova = null;
  formProduto = false;
  salvar();
  render();
}

function excluirProduto(pid) {
  fecharModal();
  const p = dados.products.find(x => x.id === pid);
  if (!p) return;
  if (!confirm('Excluir "' + p.nome + '" do catálogo?\n\nAs vendas já registradas continuam no caixa.')) return;
  dados.products = dados.products.filter(x => x.id !== pid);
  salvar();
  render(true);
  toast('Peça excluída');
}

/* ---------------- vendas ---------------- */

function escolherPagamento(f) {
  pagamento = f;
  const bts = document.querySelectorAll('#opPagamento button');
  bts.forEach(b => b.classList.toggle('sel', b.textContent.trim() === f));
}

function preencherPreco() {
  const p = dados.products.find(x => x.id === valor('#vProduto'));
  const campo = $('#vValor');
  if (p && campo && !campo.value.trim()) campo.value = String(p.preco).replace('.', ',');
}

function registrarVenda() {
  const p = dados.products.find(x => x.id === valor('#vProduto'));
  const cliente = valor('#vCliente').trim();
  const v = num(valor('#vValor'));

  if (!p) return toast('Escolha a peça vendida');
  if (!cliente) return toast('Informe o nome da cliente');
  if (v <= 0) return toast('Informe o valor da venda');

  const ts = Date.now();
  const vid = id('v');
  dados.sales.unshift({
    id: vid, produtoId: p.id, produto: p.nome, foto: p.foto,
    cliente, pagamento, valor: v, ts,
  });
  dados.movements.unshift({
    id: id('m'), vendaId: vid, tipo: 'entrada', desc: 'Venda · ' + p.nome, valor: v, ts,
  });
  p.estoque = Math.max(0, p.estoque - 1);

  pagamento = 'Pix';
  salvar();
  render();
  toast('Venda registrada · ' + brl(v));
}

function excluirVenda(vid) {
  fecharModal();
  const v = dados.sales.find(x => x.id === vid);
  if (!v) return;
  if (!confirm('Excluir esta venda?\n\nO valor sai do caixa e a peça volta ao estoque.')) return;
  dados.sales = dados.sales.filter(x => x.id !== vid);
  dados.movements = dados.movements.filter(m => m.vendaId !== vid);
  const p = dados.products.find(x => x.id === v.produtoId);
  if (p) p.estoque += 1;
  salvar();
  render(true);
  toast('Venda excluída');
}

function alternarFormCaixa() {

function escolherTipo(t) {

function registrarCaixa() {

function excluirMovimento(mid) {

  if (m.vendaId) return excluirVenda(m.vendaId);

function menuAjustes() {
  abrirModal('Bazar da Anna', `
    <div style="font-size:13.5px; color:var(--suave); margin-bottom:14px; line-height:1.5;">
      Os dados ficam guardados só neste celular. Faça uma cópia de vez em quando.
    </div>
    <button class="acao" onclick="exportar()">Salvar cópia dos dados</button>
    <label class="acao" style="display:block;">Restaurar de uma cópia
      <input type="file" accept="application/json,.json" style="display:none" onchange="importar(event)">
    </label>`);
}

function exportar() {
  const nome = 'bazar-anna-' + new Date().toISOString().slice(0, 10) + '.json';
  const blob = new Blob([JSON.stringify(dados, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nome;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  fecharModal();
  toast('Cópia gerada — salve em Arquivos');
}

function importar(ev) {
  const arq = ev.target.files && ev.target.files[0];
  if (!arq) return;
  const leitor = new FileReader();
  leitor.onload = () => {
    try {
      const d = JSON.parse(leitor.result);
      if (!d || !Array.isArray(d.products)) throw new Error('formato');
      if (!confirm('Substituir os dados atuais pelos da cópia?')) return;
      dados = {
        products: d.products || [],
        sales: Array.isArray(d.sales) ? d.sales : [],
        movements: Array.isArray(d.movements) ? d.movements : [],
      };
      salvar();
      fecharModal();
      irPara('inicio');
      toast('Dados restaurados');
    } catch (e) {
      toast('Arquivo inválido');
    }
  };
  leitor.readAsText(arq);
}
